name: Apply ELATEC WriteData reliability fix

on:
  push:
    branches:
      - fix/elatec-desfire-reliability

permissions:
  contents: write

jobs:
  apply-fix:
    if: contains(github.event.head_commit.message, '[apply-elatec-writedata-fix]')
    runs-on: windows-latest

    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: fix/elatec-desfire-reliability
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply focused source changes
        shell: pwsh
        run: |
          @'
          import re
          from pathlib import Path

          def replace_regex_once(path: str, pattern: str, replacement: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8-sig")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one regex match in {path}, found {count}")
              file_path.write_text(updated, encoding="utf-8")

          replace_regex_once(
              "RFiDGear/Infrastructure/ReaderProviders/ElatecNetProvider.cs",
              r'''^        public async override Task<ERROR> WriteMiFareDESFireChipFile\(string _appWriteKey, DESFireKeyType _keyTypeAppWriteKey, int _writeKeyNo,\s*\n\s*EncryptionMode _encMode,\s*\n\s*int _fileNo, int _appID, byte\[\] _data\)\s*\n        \{.*?^        \}\s*\n\s*        #endregion''',
              '''        public async override Task<ERROR> WriteMiFareDESFireChipFile(string _appWriteKey, DESFireKeyType _keyTypeAppWriteKey, int _writeKeyNo,
                                        EncryptionMode _encMode,
                                        int _fileNo, int _appID, byte[] _data)
        {
            try
            {
                await readerDevice.MifareDesfire_SelectApplicationAsync((uint)_appID);

                var authResult = await AuthToMifareDesfireApplication(
                    _appWriteKey,
                    _keyTypeAppWriteKey,
                    _writeKeyNo,
                    _appID);

                if (authResult != ERROR.NoError)
                {
                    return authResult;
                }

                await readerDevice.MifareDesfire_WriteDataAsync(
                    (byte)_fileNo,
                    _data,
                    (Elatec.NET.Cards.Mifare.EncryptionMode)_encMode);

                return ERROR.NoError;
            }
            catch (Exception e)
            {
                Log.ForContext<ElatecNetProvider>().Error(e, "Elatec operation failed.");
                return ERROR.AuthFailure;
            }
        }

        #endregion''')

          replace_regex_once(
              "RFiDGear/ViewModels/TaskSetupViewModels/MifareDesfireSetupViewModel.cs",
              r'''^(\s*)if \(SelectedDesfireFileType == FileType_MifareDesfireFileType\.BackupFile && device\.GetType\(\) == typeof\(ElatecNetProvider\)\)\s*\n\1\{\s*\n\1\s+await device\.CommitTransactionAsync\(\);\s*\n\1\}\s*\n\s*\1if \(result == ERROR\.NoError\)''',
              r'''\1if (result == ERROR.NoError &&
\1    SelectedDesfireFileType == FileType_MifareDesfireFileType.BackupFile &&
\1    device.GetType() == typeof(ElatecNetProvider))
\1{
\1    result = await device.CommitTransactionAsync();
\1}

\1if (result == ERROR.NoError)''')
          '@ | python -

      - name: Run automated tests
        shell: pwsh
        run: dotnet test RFiDGear.Tests/RFiDGear.Tests.csproj --configuration Release

      - name: Commit focused fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RFiDGear/Infrastructure/ReaderProviders/ElatecNetProvider.cs RFiDGear/ViewModels/TaskSetupViewModels/MifareDesfireSetupViewModel.cs
          git diff --cached --check
          git commit -m "Fix ELATEC WriteData and backup commit results (#180)"
          git push origin HEAD:fix/elatec-desfire-reliability
